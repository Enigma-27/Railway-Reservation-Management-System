<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Railway Reservation & Management System (RRMS): search trains, book seats, check PNR status and follow live trains." />
    <meta name="theme-color" content="#070c18" />
    <title>RRMS - Railway Reservation & Management System</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Set the theme BEFORE the first paint (no flash of the wrong theme): saved choice, else the system preference -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('rrms_theme'); } catch (e) { /* storage off */ }
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="preload" as="image" href="/train-sunset.jpg" fetchpriority="high" />
    <link rel="stylesheet" href="/rrms-theme.css" />
    <link rel="stylesheet" href="/rrms-palette.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/rrms-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
